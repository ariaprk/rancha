# Builds Rancha for Windows and Linux and attaches the files to a GitHub Release.
# Start it by pushing a version tag that matches "version" in package.json, e.g.
#   git tag v0.3.0   then   git push origin v0.3.0
# If docs/RELEASE_NOTES_<tag>.md exists, it becomes the release description.
# (or run it by hand from the "Actions" tab to just test the builds).
name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: rancha-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Find the release notes
        id: notes
        shell: bash
        run: |
          file="docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          if [ -f "$file" ]; then echo "path=$file" >> "$GITHUB_OUTPUT"; else echo "::warning::$file not found"; fi
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # Normally the release is created in this same repository. To keep the code private
          # but let people download the app, set the variable RELEASES_REPO (e.g. "aria/rancha-releases",
          # a public repository) and the secret RELEASES_TOKEN (see docs/RELEASING.md).
          repository: ${{ vars.RELEASES_REPO || github.repository }}
          token: ${{ secrets.RELEASES_TOKEN || github.token }}
          tag_name: ${{ github.ref_name }}
          files: files/*
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
